name: Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::DEPLOY_PATH is not configured"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY is not configured"; exit 1; }

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "${{ runner.temp }}/deploy_key"
          chmod 600 "${{ runner.temp }}/deploy_key"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Verify Docker Compose on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_OPTS: -i ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f '$DEPLOY_PATH/.env' && docker compose version"

      - name: Copy application files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_OPTS: -i ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          # 서버에서 생성한 미디어는 전송·삭제 대상에서 제외하고 소스 코드만 동기화한다.
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='frontend/.next/' \
            --exclude='backend/resuit/build/' \
            --exclude='backend/resuit/.gradle/' \
            --exclude='/backend/resuit/src/main/media/' \
            -e "ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Build and restart services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_OPTS: -i ${{ runner.temp }}/deploy_key
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && \
            docker compose --env-file .env -f compose.yml -f compose.prod.yml up -d --build --remove-orphans && \
            docker compose --env-file .env -f compose.yml -f compose.prod.yml ps"
