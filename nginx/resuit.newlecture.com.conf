# 공용 서버 호스트 nginx용 사이트 설정.
# Docker 컨테이너 nginx가 아니라, 서버에 이미 있는 nginx에 등록한다.
#
# 적용 예:
#   sudo cp nginx/resuit.newlecture.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/resuit.newlecture.com.conf /etc/nginx/sites-enabled/
#   # conf.d 방식을 쓰면:
#   # sudo cp nginx/resuit.newlecture.com.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 전제: Compose 프론트가 127.0.0.1:3003 에서 대기한다.
# /api, /media 는 Next.js rewrite 로 Docker 네트워크의 backend:8080 에 전달된다.

server {
    listen 80;
    server_name resuit.newlecture.com;

    client_max_body_size 52m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
