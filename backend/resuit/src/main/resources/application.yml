spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

# 실제 값은 환경 변수로 공급한다.
resuit:
  media:
    root: ${RESUIT_MEDIA_ROOT:src/main/media}
  integration:
    token-secret: ${INTEGRATION_TOKEN_SECRET:}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
