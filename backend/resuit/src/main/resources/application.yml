spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

# 실제 값은 환경 변수로 공급한다.
resuit:
  media:
    root: ${RESUIT_MEDIA_ROOT:src/main/media}
  integration:
    token-secret: ${INTEGRATION_TOKEN_SECRET:}
  # 토스페이먼츠 API 개별 연동 키(test_ck_, test_sk_). 값은 .env에만 둔다.
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
